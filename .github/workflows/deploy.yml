name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_OPTIONS: '--max_old_space_size=8196'

permissions:
  contents: read
  pages: write
  id-token: write

# A deploy in flight should finish; the next push queues behind it rather
# than leaving Pages on a cancelled upload.
concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ⚙️ Setup and install
        uses: ./.github/actions/setup-and-install
      - name: 🗂️ Restore Nx cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.sha }}
          restore-keys: nx-${{ runner.os }}-
      - name: 📖 Build docs site
        run: yarn nx run gamut-docs:full-site
      - name: 📤 Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packages/gamut-docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
