name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: yarn install
      - run: yarn build-storybook
      - run: yarn build-docs
      - run: |
          rm -rf ./dist/docs
          mkdir -p ./dist/docs/storybook
          cp -R ./packages/gamut-docs/dist/. ./dist/docs
          cp -R ./dist/storybook/styleguide/. ./dist/docs/storybook
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
