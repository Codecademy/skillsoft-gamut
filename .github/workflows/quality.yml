# Quality checks. If it's a quick check that should happen on PRs and main, put it here.
name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_OPTIONS: '--max_old_space_size=8196'

permissions:
  contents: read

# Superseded pull request runs are abandoned; runs on `main` are the record of
# whether a commit is good, so they finish.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The sole writer of the Nx cache. Every other job only restores it, so the
  # cache has one producer and can't be grown by nine jobs each saving their
  # own copy. Caches written on `main` are readable by every PR branch, so this
  # is what makes `run-many --all` cheap on PRs that touch one package.
  #
  # Nx Cloud would make this redundant, but its token is read-scoped.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ⚙️ Setup and install
        uses: ./.github/actions/setup-and-install
      # Only `.nx/cache`. `.nx/workspace-data` holds the SQLite project graph,
      # which is machine-specific and must be rebuilt per run.
      - name: 🗂️ Nx cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.sha }}
          restore-keys: nx-${{ runner.os }}-
      - name: 🏗 Build all packages
        run: yarn build
      - name: 🔍 Verify published package shape
        run: yarn nx run-many --target=verify-package --all
      - name: 🔍 Verify exports maps resolve
        run: node script/verify-exports.mjs

  changeset-check:
    if: github.event.pull_request.head.ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `changeset status --since` diffs against origin/main, which a shallow clone lacks.
          fetch-depth: 0
      - name: ⚙️ Setup and install
        uses: ./.github/actions/setup-and-install
      - name: 🦋 Verify a changeset was added
        run: yarn changeset status --since=origin/main

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ⚙️ Setup and install
        uses: ./.github/actions/setup-and-install
      - name: ✨ Format check
        run: yarn format:verify

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ⚙️ Setup and install
        uses: ./.github/actions/setup-and-install
      - name: 🏗 Build all packages
        run: yarn build
      - name: 🔍 Lint
        run: yarn lint

  dedupe-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ⚙️ Setup and install
        uses: ./.github/actions/setup-and-install
      - name: 🔍 Check for duplicate dependencies
        run: yarn dedupe --check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ⚙️ Setup and install
        uses: ./.github/actions/setup-and-install
      - name: 🗂️ Restore Nx cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.sha }}
          restore-keys: nx-${{ runner.os }}-
      - name: 🔍 Test
        run: yarn test --ci --coverage --runInBand
      - name: 📤 Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: ./coverage
          retention-days: 30
      - name: ☂️ Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Codecademy/skillsoft-gamut
          flags: ${{ github.event_name == 'pull_request' && 'pull-request' || 'main' }}
          fail_ci_if_error: false
          directory: ./coverage
          report_type: coverage
      - name: ☂️ Upload test results to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Codecademy/skillsoft-gamut
          flags: ${{ github.event_name == 'pull_request' && 'pull-request' || 'main' }}
          fail_ci_if_error: false
          directory: ./coverage
          report_type: test_results

  test-storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ⚙️ Setup and install
        uses: ./.github/actions/setup-and-install
      - name: 🗂️ Restore Nx cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.sha }}
          restore-keys: nx-${{ runner.os }}-
      - name: 🏗 Build all packages
        run: yarn build
      - name: ⚙️ Install Playwright
        run: yarn playwright install chromium --with-deps
      - name: 🔍 Storybook stories and accessibility tests
        run: yarn test:stories

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ⚙️ Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: javascript-typescript
          build-mode: none
      - name: 🔍 Perform CodeQL analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
