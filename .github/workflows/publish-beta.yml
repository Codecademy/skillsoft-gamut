name: Publish Beta

# Publishes a continuous prerelease build from `beta` under the stable `beta`
# npm dist-tag, mirroring publish-next.yml (main -> next) one step further
# down the branch flow: main -> beta -> production.
#
# TODO(release-scaffold): the `beta` branch doesn't exist yet (see
# https://skillsoftdev.atlassian.net/wiki/spaces/779a16d9c7ea452eab11b39cbbe771ce/whiteboard/6753517596).
# This workflow is intentionally dormant until that branch is created. It's
# also dry-run only while the release groups / @skillsoft scope migration is
# being scaffolded. Remove `dry-run: true` below once the @skillsoft npm org/
# token are ready and we actually want `beta` to publish for real.

on:
  push:
    branches:
      - beta

env:
  NODE_OPTIONS: '--max_old_space_size=8196'
  NX_CLOUD: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: publish-beta
  cancel-in-progress: false

jobs:
  publish-beta:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Publish beta packages
        uses: ./.github/actions/publish-prerelease
        with:
          tag-prefix: beta
          npm-tag: beta
          manifest-name: beta-publish-manifest.json
          dry-run: 'true'
          npm-token-secret: ${{ secrets.NODE_AUTH_TOKEN }}
          gh-token: ${{ secrets.ACTIONS_GITHUB_TOKEN }}
