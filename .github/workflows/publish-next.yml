name: Publish Next

# Publishes a continuous prerelease build from `main` under the stable `next`
# npm dist-tag, mirroring how `alpha` publishes work per-PR (see
# publish-alpha.yml) but with one moving tag instead of a unique tag per build.
#
# TODO(release-scaffold): this is currently dry-run only while the release
# groups / @skillsoft scope migration is being scaffolded. Remove `dry-run:
# true` below once the @skillsoft npm org/token are ready and we actually
# want `main` to publish for real.

on:
  push:
    branches:
      - main

env:
  NODE_OPTIONS: '--max_old_space_size=8196'
  NX_CLOUD: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: publish-next
  cancel-in-progress: false

jobs:
  publish-next:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Publish next packages
        uses: ./.github/actions/publish-prerelease
        with:
          tag-prefix: next
          npm-tag: next
          manifest-name: next-publish-manifest.json
          dry-run: 'true'
          npm-token-secret: ${{ secrets.NODE_AUTH_TOKEN }}
          gh-token: ${{ secrets.ACTIONS_GITHUB_TOKEN }}
